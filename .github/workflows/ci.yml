# CI mirrors what Vercel does from a fresh clone, so gitignored-but-required
# files (the creative-context dist incident) and platform limits (the
# 2048-route incident) fail here instead of on the production deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dummy values so the framework's production-config validation passes in CI
# (agent-native typecheck/build load app config and hard-fail without them).
# Nothing is deployed or connected from CI; real values live only in Vercel.
env:
  BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-0000000000000000
  A2A_SECRET: ci-dummy-a2a-secret-00000000000000000000000000
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci_build_only

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test

  build:
    name: Vercel-parity build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same commands as vercel.json's buildCommand. Production migrations are
      # gated on VERCEL_ENV=production there and are intentionally not run in
      # CI. compress-vercel-routes exits non-zero above Vercel's 2048-route
      # deployment limit.
      - run: npx @agent-native/core@latest deploy --preset vercel --build-only
      - run: node scripts/compress-vercel-routes.mjs
